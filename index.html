
<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102A43">

  <title>Primize | Ofertas cerca de ti</title>
  <meta
    name="description"
    content="Descubre ofertas, promociones y experiencias cerca de ti."
  >

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/styles.css">
  
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />


  <style>
    :root {
      --primary: #102A43;
      --accent: #16A085;
      --page: #F4F7FA;
      --text: #243B53;
      --muted: #627D98;
      --border: #D9E2EC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 16px 5%;
    }

    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      color: var(--primary);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
    }

    .brand span {
      color: var(--accent);
    }

    .location-label {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 5% 60px;
    }

    .intro {
      margin-bottom: 24px;
    }

    .intro h1 {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -1.2px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin: 24px 0 18px;
    }

    .search-box input {
      min-width: 0;
      flex: 1;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      color: var(--text);
      outline-offset: 2px;
    }

    .primary-button {
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: var(--white);
      padding: 14px 18px;
      font-weight: 650;
    }

    .primary-button:hover {
      opacity: 0.92;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 28px;
    }

    .filter-button {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
      background: var(--white);
      color: var(--text);
    }

    .filter-button[aria-pressed="true"] {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--white);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--primary);
      font-size: 21px;
    }

    .map-panel {
      min-height: 260px;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background:
        linear-gradient(135deg, #E8F3F1, #EDF3F8);
      text-align: center;
    }

    .map-symbol {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .map-panel h3 {
      margin: 0 0 8px;
      color: var(--primary);
    }

    .map-panel p {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .offers-section {
      margin-top: 32px;
    }

    .results-status {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      line-height: 1.6;
    }

    .results-status h3 {
      margin-top: 0;
      color: var(--primary);
    }

    .results-status p {
      color: var(--muted);
    }

    .footer {
      padding: 22px 5%;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    
    @media (max-width: 600px) {
    
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    
      body.map-first {
        height: 100vh;
        height: 100dvh;
        background: #ffffff;
      }
    
      /* TOPBAR: logo y filtros en una fila */
      body.map-first .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1100;
        height: 62px;
        padding: 0 12px;
        border: 0;
        background: #ffffff;
      }
    
      body.map-first .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        height: 100%;
        max-width: none;
        gap: 12px;
      }
    
      body.map-first .brand {
        flex: 0 0 auto;
        font-size: 24px;
      }
    
      body.map-first .location-label {
        display: none;
      }
    
      /* MAPA A PANTALLA COMPLETA */
      body.map-first main.map-app {
        position: fixed;
        inset: 62px 0 0;
        width: 100%;
        max-width: none;
        height: auto;
        margin: 0;
        padding: 0;
      }
      
      /* Contenedor principal del mapa */
      body.map-first .map-stage {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
        padding: 0;
      }
      
      /* Mapa con márgenes y esquinas redondeadas */
      body.map-first .map-panel {
        position: absolute;
        top: 0;
        right: 12px;
        bottom: 12px;
        left: 12px;
      
        display: block;
        width: auto;
        height: auto;
        min-height: 0;
        margin: 0;
        padding: 0;
      
        border: none;
        border-radius: 20px;
        overflow: hidden;
        background: #e8eef2;
      }
      
      /* Leaflet ocupa todo el interior del mapa */
      body.map-first #map {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
        padding: 0;
      }

      /* FILTROS EN TOPBAR */
      body.map-first .floating-filters {
        position: fixed;
        top: 10px;
        left: 112px;
        right: 0;
        z-index: 1200;
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 7px;
        height: 44px;
        margin: 0;
        padding: 0 12px 0 0;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
    
      body.map-first .floating-filters::-webkit-scrollbar {
        display: none;
      }
    
      body.map-first .floating-filters .filter-button {
        flex: 0 0 auto;
        min-height: 38px;
        padding: 0 13px;
        border: 0;
        border-radius: 999px;
        background: #e8edf2;
        color: #102a43;
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
      }
    
      body.map-first .floating-filters
      .filter-button[aria-pressed="true"] {
        background: #102a43;
        color: #ffffff;
      }
    
      /* BUSCADOR FLOTANTE */
      body.map-first .floating-search {
        position: absolute;
        top: 12px;
        left: 14px;
        right: 14px;
        z-index: 900;
        display: flex;
        flex-direction: row;
        align-items: center;
        height: 52px;
        gap: 8px;
        margin: 0;
        padding: 5px 12px;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 4px 20px rgb(0 0 0 / 18%);
      }
    
      body.map-first .floating-search input {
        flex: 1;
        width: auto;
        min-width: 0;
        min-height: 40px;
        padding: 0 4px;
        border: 0;
        outline-offset: 2px;
        background: transparent;
        font-size: 14px;
      }
    
      body.map-first .floating-search .primary-button {
        flex: 0 0 auto;
        width: auto;
        min-height: 38px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 12px;
      }
    
      /* UBICACIÓN */
      body.map-first .map-status {
        position: absolute;
        right: 14px;
        bottom: 100px;
        z-index: 800;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
    
      body.map-first #locate-me {
        width: auto;
        min-height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: #ffffff;
        color: #102a43;
        box-shadow: 0 3px 14px rgb(0 0 0 / 15%);
        font-size: 13px;
      }
    
      body.map-first #location-status {
        max-width: 220px;
        margin: 0;
        font-size: 12px;
        text-align: right;
      }
    
      /* LISTA DE PROMOCIONES */
      body.map-first .floating-list-button {
        position: absolute;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 850;
        transform: translateX(-50%);
        min-height: 46px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #102a43;
        color: #ffffff;
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
      }
    
      /* PANEL INFERIOR */
      body.map-first .offers-panel {
        position: absolute;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 12px;
        z-index: 1000;
        max-height: 55%;
        padding: 16px;
        overflow-y: auto;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 5px 25px rgb(0 0 0 / 20%);
      }
    
      body.map-first .offers-panel[hidden] {
        display: none;
      }
    
      body.map-first .offers-panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
    
      body.map-first .offers-panel-heading h2 {
        margin: 0;
        font-size: 18px;
      }
    
      body.map-first .close-offers-button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: #edf2f7;
        font-size: 24px;
      }
    
      body.map-first .footer {
        display: none;
      }
      
      /* Lupa decorativa */
      body.map-first .search-icon {
        display: flex;
        flex: 0 0 24px;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 36px;
        color: #102a43;
        pointer-events: none;
      }
      
      /* X limpia, sin cuadrado ni fondo */
      body.map-first .search-clear-button {
        appearance: none;
        -webkit-appearance: none;
        display: flex;
        flex: 0 0 24px;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 36px;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 0;
        outline: none;
        background: transparent;
        box-shadow: none;
        color: #64748b;
        cursor: pointer;
      }
      
      body.map-first .search-clear-button svg {
        display: block;
        border: none;
        background: transparent;
      }
      
      /* Mantener accesibilidad con teclado */
      body.map-first .search-clear-button:focus-visible {
        outline: 2px solid #16a085;
        outline-offset: 3px;
        border-radius: 4px;
      }
      
    }
    </style>
</head>


<body class="map-first">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Primize, inicio">
        primize<span>.</span>
      </a>
      <div class="location-label" id="location-label">
        Descubre ofertas locales
      </div>
    </div>
  </header>

  <main class="map-app"> 
    <form
      class="search-box floating-search"
      id="search-form"
      role="search"
    >
      
      <span class="search-icon" aria-hidden="true">
        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
      </span>
    
      <input
        id="search-input"
        type="search"
        placeholder="Lugar, producto o comercio..."
        aria-label="Buscar lugar, producto o comercio"
      >
    
      <button
        class="search-clear-button"
        id="search-clear"
        type="button"
        aria-label="Limpiar búsqueda"
      >
        <svg
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
      </button>
    </form>

    <nav class="filters floating-filters" aria-label="Filtrar por categoría">
      <button class="filter-button" type="button"
        data-category="todas" aria-pressed="true">Todas</button>
      <button class="filter-button" type="button"
        data-category="gastronomia" aria-pressed="false">🍽️ Gastronomía</button>
      <button class="filter-button" type="button"
        data-category="comercio" aria-pressed="false">🛍️ Comercio</button>
      <button class="filter-button" type="button"
        data-category="experiencias" aria-pressed="false">🎯 Experiencias</button>
      <button class="filter-button" type="button"
        data-category="servicios" aria-pressed="false">✨ Servicios</button>
    </nav>

    <section class="map-stage" aria-label="Mapa y promociones">
      <div class="map-panel" id="map-panel">
        <div
          id="map"
          role="application"
          aria-label="Mapa interactivo de ofertas locales"
        ></div>
      </div>

      <div class="map-status" id="map-status">
        <p id="location-status" role="status" aria-live="polite"></p>
        <button id="locate-me" type="button">
          <span aria-hidden="true">◎</span> Mi ubicación
        </button>
      </div>

      <button
        class="floating-list-button"
        id="toggle-offers-list"
        type="button"
        aria-controls="offers-panel"
        aria-expanded="false"
      >
        <span aria-hidden="true">☷</span>
        Ver promociones
      </button>

      <section
        class="offers-panel"
        id="offers-panel"
        aria-labelledby="offers-title"
        hidden
      >
        <div class="offers-panel-heading">
          <h2 id="offers-title">Ofertas cerca de ti</h2>
          <button
            id="close-offers-list"
            class="close-offers-button"
            type="button"
            aria-label="Cerrar lista de promociones"
          >×</button>
        </div>

        <div
          class="results-status"
          id="results-status"
          role="status"
          aria-live="polite"
        >
          <h3>Estamos preparando las ofertas</h3>
          <p>Las promociones disponibles aparecerán aquí.</p>
        </div>

        <div id="offers-list" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <footer class="footer">
    Primize · Descubre lo que está pasando cerca de ti.
  </footer>
  
  <script type="module">   
    import * as L from "https://esm.sh/leaflet@1.9.4";
    import { searchOffers } from "/js/map.js";

    
    const mapElement = document.querySelector("#map");

    const map = L.map(mapElement).setView(
      [-32.9333, -71.5167],
      13
    );

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(map);

    const offerMarkers = L.featureGroup().addTo(map);
    const markersByOfferId = new Map();

    
    const offerMarkerIcon = L.icon({
      iconUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
      iconRetinaUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
      shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41],
    });

    
    function renderMapOffers(offers) {
      offerMarkers.clearLayers();
      markersByOfferId.clear();

      for (const offer of offers) {
        const latitude = Number(offer.latitude);
        const longitude = Number(offer.longitude);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude) ||
          latitude < -90 ||
          latitude > 90 ||
          longitude < -180 ||
          longitude > 180
        ) {
          continue;
        }

        const marker = L.marker(
          [latitude, longitude],
          { icon: offerMarkerIcon }
        );

        const popup = document.createElement("div");
        popup.className = "offer-popup";

        const title = document.createElement("strong");
        title.className = "offer-popup-title";
        title.textContent = offer.title || "Oferta local";

        const store = document.createElement("p");
        store.className = "offer-popup-store";
        store.textContent = offer.store_name || "Comercio local";

        const category = document.createElement("p");
        category.className = "offer-popup-category";
        category.textContent = offer.category
          ? `Categoría: ${offer.category}`
          : "";

        const address = document.createElement("p");
        address.className = "offer-popup-address";
        address.textContent =
          offer.store_address || "Dirección no disponible";

        popup.append(title, store);

        if (offer.category) {
          popup.append(category);
        }

        popup.append(address);

        if (offer.is_sponsor) {
          const sponsor = document.createElement("span");
          sponsor.className = "offer-popup-sponsor";
          sponsor.textContent = "Oferta patrocinada";
          popup.append(sponsor);
        }

        marker.bindPopup(popup);
        
        marker.on("click", () => {
          highlightOfferCard(offer.id);
        });

        markersByOfferId.set(String(offer.id), marker);
        offerMarkers.addLayer(marker);
      }
      
      if (
        offerMarkers.getLayers().length > 0 &&
        !currentUserLocation
      ) {
        map.fitBounds(offerMarkers.getBounds(), {
          padding: [30, 30],
          maxZoom: 15,
        });
      }
    }

    function highlightOfferCard(offerId) {
      const cards = offersList.querySelectorAll("[data-offer-id]");

      for (const card of cards) {
        const isSelected = card.dataset.offerId === String(offerId);

        card.classList.toggle("offer-selected", isSelected);

        if (isSelected) {
          card.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
          });
        }
      }
    }

    function focusOfferOnMap(offerId) {
      const marker = markersByOfferId.get(String(offerId));

      if (!marker) {
        return;
      }

      map.setView(marker.getLatLng(), 16);
      marker.openPopup();
      highlightOfferCard(offerId);
    }
    
    const locateButton = document.querySelector("#locate-me");
    const locationStatus = document.querySelector("#location-status");

    let userLocationMarker = null;

    locateButton.addEventListener("click", () => {
      if (!navigator.geolocation) {
        locationStatus.textContent =
          "Tu navegador no permite obtener la ubicación.";
        return;
      }

      locateButton.disabled = true;
      locationStatus.textContent = "Buscando tu ubicación…";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const userCoordinates = [latitude, longitude];

          currentUserLocation = { latitude, longitude };

          map.setView(userCoordinates, 15);

          if (userLocationMarker) {
            map.removeLayer(userLocationMarker);
          }

          userLocationMarker = L.circleMarker(userCoordinates, {
            radius: 9,
            color: "#ffffff",
            weight: 3,
            fillColor: "#2563eb",
            fillOpacity: 1,
          }).addTo(map);

          userLocationMarker.bindPopup("Estás aquí").openPopup();

          locationStatus.textContent =
            "Ubicación encontrada. Explorando ofertas cercanas…";

          locateButton.disabled = false;

          loadOffers();
        },
        
        (error) => {
          if (error.code === 1) {
            locationStatus.textContent =
              "No se concedió permiso para acceder a tu ubicación.";
          } else if (error.code === 2) {
            locationStatus.textContent =
              "No pudimos determinar tu ubicación. Inténtalo nuevamente.";
          } else {
            locationStatus.textContent =
              "La solicitud tardó demasiado. Inténtalo nuevamente.";
          }

          locateButton.disabled = false;
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000,
        }
      );
    });

    const searchForm = document.querySelector("#search-form");
    const searchInput = document.querySelector("#search-input");
    const statusBox = document.querySelector("#results-status");
    const offersList = document.querySelector("#offers-list");
    const categoryButtons =
      document.querySelectorAll("[data-category]");

    let selectedCategory = "";
    let searchTerm = "";
    let requestNumber = 0;

    function showMessage(title, message) {
      statusBox.replaceChildren();

      const heading = document.createElement("h3");
      heading.textContent = title;

      const paragraph = document.createElement("p");
      paragraph.textContent = message;

      statusBox.append(heading, paragraph);
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat("es-CL", {
        dateStyle: "medium",
        timeStyle: "short",
      }).format(new Date(value));
    }

    let currentUserLocation = null;

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const toRadians = (degrees) => (degrees * Math.PI) / 180;
      const earthRadiusKm = 6371;

      const latitudeDifference = toRadians(lat2 - lat1);
      const longitudeDifference = toRadians(lon2 - lon1);

      const a =
        Math.sin(latitudeDifference / 2) ** 2 +
        Math.cos(toRadians(lat1)) *
          Math.cos(toRadians(lat2)) *
          Math.sin(longitudeDifference / 2) ** 2;

      const safeA = Math.min(1, Math.max(0, a));

      return (
        2 *
        earthRadiusKm *
        Math.atan2(Math.sqrt(safeA), Math.sqrt(1 - safeA))
      );
    }

    function sortOffersByDistance(offers) {
      if (!currentUserLocation) {
        return offers;
      }

      return [...offers].sort((a, b) => {
        const distanceA = calculateDistanceKm(
          currentUserLocation.latitude,
          currentUserLocation.longitude,
          Number(a.latitude),
          Number(a.longitude)
        );

        const distanceB = calculateDistanceKm(
          currentUserLocation.latitude,
          currentUserLocation.longitude,
          Number(b.latitude),
          Number(b.longitude)
        );

        return distanceA - distanceB;
      });
    }

    function formatDistance(distanceKm) {
      if (distanceKm < 1) {
        return `A ${Math.round(distanceKm * 1000)} m de ti`;
      }

      return `A ${distanceKm.toLocaleString("es-CL", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
      })} km de ti`;
    }

    function renderOffers(offers) {
      offersList.replaceChildren();

      if (offers.length === 0) {
        showMessage(
          "No hay ofertas disponibles",
          "Por ahora no encontramos ofertas públicas que coincidan con tu búsqueda. Vuelve pronto para descubrir nuevas oportunidades."
        );
        return;
      }

      showMessage(
        `${offers.length} ${offers.length === 1 ? "oferta encontrada" : "ofertas encontradas"}`,
        "Estas son las promociones disponibles actualmente."
      );

      for (const offer of offers) {
        const card = document.createElement("article");
        card.className = "results-status";
        card.dataset.offerId = String(offer.id);
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute(
          "aria-label",
          `Ver en el mapa: ${offer.title || "Oferta local"}`
        );

        const title = document.createElement("h3");
        title.textContent = offer.title || "Oferta local";

        const store = document.createElement("p");
        store.textContent = offer.store_name || "Comercio local";

        const category = document.createElement("p");
        category.textContent = `Categoría: ${offer.category}`;

        const address = document.createElement("p");
        address.textContent =
          offer.store_address || "Dirección no disponible";

        const validity = document.createElement("p");
        validity.textContent =
          `Válida hasta: ${formatDate(offer.end_time)}`;

        if (currentUserLocation) {
          const latitude = Number(offer.latitude);
          const longitude = Number(offer.longitude);

          if (
            Number.isFinite(latitude) &&
            Number.isFinite(longitude) &&
            latitude >= -90 &&
            latitude <= 90 &&
            longitude >= -180 &&
            longitude <= 180
          ) {
            const distanceKm = calculateDistanceKm(
              currentUserLocation.latitude,
              currentUserLocation.longitude,
              latitude,
              longitude
            );

            const distance = document.createElement("p");
            distance.className = "offer-distance";
            distance.textContent = formatDistance(distanceKm);

            card.append(distance);
          }
        }

        card.append(title, store, category, address, validity);

        if (offer.is_sponsor) {
          const sponsor = document.createElement("p");
          sponsor.textContent = "Oferta patrocinada";
          card.append(sponsor);
        }

        card.addEventListener("click", () => {
          focusOfferOnMap(offer.id);
        });

        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            focusOfferOnMap(offer.id);
          }
        });

        offersList.append(card);
      }
    }
    
    async function loadOffers() {
      const currentRequest = ++requestNumber;

      showMessage(
        "Cargando ofertas...",
        "Estamos consultando las promociones públicas."
      );

      offersList.replaceChildren();

      try {
        const categoryMap = {
          todas: "",
          gastronomia: "Gastronomia",
          comercio: "Comercio",
          experiencias: "Tours/Aventura",
          servicios: "Servicios",
        };

        const category = categoryMap[selectedCategory] ?? "";
        
        const offers = await searchOffers({
          query: searchTerm,
          category,
        });

        if (currentRequest !== requestNumber) return;

        const sortedOffers = sortOffersByDistance(offers);

        renderOffers(sortedOffers);
        renderMapOffers(sortedOffers);
      } catch (error) {
        console.error("Error al cargar ofertas:", error);

        if (currentRequest !== requestNumber) return;

        showMessage(
          "No pudimos cargar las ofertas",
          "Comprueba tu conexión e inténtalo de nuevo. Si el problema continúa, revisaremos la configuración de Supabase."
        );
      }
    }

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      searchTerm = searchInput.value.trim();
      loadOffers();
    });

    const searchClearButton = document.querySelector("#search-clear");
    
    searchClearButton.addEventListener("click", () => {
      searchInput.value = "";
      searchTerm = "";
      loadOffers();
      searchInput.focus();
    });

    categoryButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;

        categoryButtons.forEach((item) => {
          item.setAttribute(
            "aria-pressed",
            String(item === button)
          );
        });

        loadOffers();
      });
    });

    loadOffers();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .catch((error) => {
            console.error(
              "No se pudo registrar el service worker:",
              error
            );
          });
      });
    }
    
    const offersPanel = document.querySelector("#offers-panel");
    const toggleOffersButton = document.querySelector("#toggle-offers-list");
    const closeOffersButton = document.querySelector("#close-offers-list");
    
    function setOffersPanelOpen(isOpen) {
      offersPanel.hidden = !isOpen;
      toggleOffersButton.setAttribute("aria-expanded", String(isOpen));
      toggleOffersButton.textContent = isOpen
        ? "× Cerrar promociones"
        : "☷ Ver promociones";
    }
    
    toggleOffersButton.addEventListener("click", () => {
      setOffersPanelOpen(offersPanel.hidden);
    });
    
    closeOffersButton.addEventListener("click", () => {
      setOffersPanelOpen(false);
    });
    
  </script>
</body>
</html>
